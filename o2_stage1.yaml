project_name: r6_stage1_kda_headgate_hybrid31
 
# O2 / R6 = R1 with GDN's forget gate (one decay per head, GDN's projection and init).
# IDENTICAL to r1_stage1_4node.yaml except: project_name, model, output_path.
# Expect "Froze 147 tensors" (same frozen set as R1-R4) and 450 trainable tensors
# (R1: 477; each KDA layer has 15 instead of 16 -- f_proj is one Linear + bias, dt_bias is a buffer).
model: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/students/afm_kda_hybrid31_headgate_init
trust_remote_code: true
 
output_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/output/r6_stage1_kda_headgate_hybrid31
use_flash_attention: true
sequence_length: 2048
 
frozen_res:
  - ^model\.embed_tokens\.
  - ^lm_head\.
  - ^model\.norm\.weight$
  - ^model\.layers\.[0-9]+\.(input_layernorm|post_attention_layernorm)\.weight$
  - ^model\.layers\.[0-9]+\.mlp\.
 
dataset:
  train_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/fineweb_edu_3B_train
  eval_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/fineweb_edu_3B_heldout
  seed: 42
  num_samples: 500000
  num_eval_samples: 200
 
teacher:
  kind: hf
  path: arcee-ai/AFM-4.5B-Base
  kwargs:
    attn_implementation: flash_attention_2
    dtype: bfloat16
 
loss_functions:
  - {function: cross_entropy, weight: 0.2}
  - {function: kl,            weight: 0.2, temperature: 2.0}
  - {function: hs_cosine,     weight: 0.6}
 
layer_mapping: all
 
functionary_packing: false
 
training_args:
  max_steps: 4580                  # 4580 x 65,536 = 300.1 M tokens
  dataset_text_field: text
  packing: true
  pad_to_multiple_of: 128
  dataset_num_proc: 16             # = R1: part of the dataset cache key -> R1's cache is reused
 
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2   # 4 nodes x 4 GPUs x 2 = global batch 32
 
  learning_rate: 1.0e-3
  weight_decay: 0.00
  warmup_ratio: 0.025
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs: {min_lr_rate: 0.01}
  max_grad_norm: 0.5
  optim: adamw_torch
  bf16: true
 
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
 
  logging_steps: 10
  save_strategy: steps
  save_steps: 500
  save_total_limit: 1              # keeps the last = checkpoint-4580, the start of stage 2
  eval_strategy: steps
  eval_steps: 500
  per_device_eval_batch_size: 1
  prediction_loss_only: true
  skip_memory_metrics: false
  report_to: none
 
