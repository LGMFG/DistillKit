project_name: r3_stage2_kda_only_finemath

# FineMath stage 2 on R3 (KDA all-linear) = R1-S2-math (r1_stage2_finemath.yaml) with only the student changed,
# i.e. r3_stage2_kda_only_unfreeze with only the training corpus changed.  Completes the 2x2 under FineMath:
#   R3-S2-math vs R3-S2    = corpus effect for this student (same start, recipe, tokens)
#   within FineMath stage 2 = mechanism (KDA vs GDN) and layout (hybrid vs all-linear) once the corpus
#   is no longer the bottleneck
#   start      r3_stage1_kda_only/checkpoint-4580 (FineWeb stage 1, the same start as R3-S2)
#   train data finemath_4plus_stage2, eval finemath_4plus_heldout (200 docs) -- as R1-S2-math
#   loss / LR / steps identical (KL 1.0 at T = 2, nothing frozen, constant 1e-5, 1.0 B tokens)
#   dataset cache: already warm (keyed by data + teacher tokenizer + num_proc, not by the student)
model: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/output/r3_stage1_kda_only/checkpoint-4580
trust_remote_code: true

output_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/output/r3_stage2_kda_only_finemath
use_flash_attention: true
sequence_length: 2048

dataset:
  train_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/finemath_4plus_stage2
  eval_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/finemath_4plus_heldout
  seed: 42
  num_eval_samples: 200

teacher:
  kind: hf
  path: arcee-ai/AFM-4.5B-Base
  kwargs:
    attn_implementation: flash_attention_2
    dtype: bfloat16

loss_functions:
  - {function: kl, weight: 1.0, temperature: 2.0}

functionary_packing: false

training_args:
  max_steps: 15260                 # 15,260 x 65,536 = 1.000 B tokens
  dataset_text_field: text
  packing: true
  pad_to_multiple_of: 128
  dataset_num_proc: 16             # MUST stay 16: it is part of the cache key

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2   # 4 nodes x 4 GPUs x 2 = 32

  learning_rate: 1.0e-5
  weight_decay: 0.00
  warmup_steps: 380
  lr_scheduler_type: constant_with_warmup
  max_grad_norm: 0.5
  optim: adamw_torch
  bf16: true

  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}

  logging_steps: 10
  save_strategy: steps
  save_steps: 1526                 # every 100 M tokens (crash safety: resume from the latest weights)
  save_total_limit: 1              # keep ONLY the latest -> checkpoint-15260 at the end (~10 GB);
                                   # only difference from R1-S2-math, does not affect training
  save_only_model: true            # weights only, ~10 GB each
  eval_strategy: steps
  eval_steps: 1526
  per_device_eval_batch_size: 1
  prediction_loss_only: true
  skip_memory_metrics: false
  report_to: none