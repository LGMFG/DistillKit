project_name: r1fm_stage2_kda_hybrid31_finemath

# RUN B: FineMath stage 1 -> FineMath stage 2.  Identical to r1_stage2_finemath.yaml (run A) except
# the starting weights: R1-S1-math (r1_stage1_hybrid31_finemath/checkpoint-4580) instead of FineWeb R1.
#   B vs A   = effect of the stage-1 corpus, given a FineMath stage 2
#   train data finemath_4plus_stage2 (no text shared with finemath_4plus_stage1, used in stage 1)
#   eval data  finemath_4plus_heldout; loss/LR/steps/checkpoints identical to A and R1-S2
#   dataset cache: already warm (keyed by data + tokenizer + num_proc, not by the student)
model: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/output/r1_stage1_hybrid31_finemath/checkpoint-4580
trust_remote_code: true

output_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/output/r1fm_stage2_kda_hybrid31_finemath
use_flash_attention: true
sequence_length: 2048

dataset:
  train_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/finemath_4plus_stage2
  eval_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/finemath_4plus_heldout
  seed: 42
  num_eval_samples: 200

teacher:
  kind: hf
  path: arcee-ai/AFM-4.5B-Base
  kwargs:
    attn_implementation: flash_attention_2
    dtype: bfloat16

loss_functions:
  - {function: kl, weight: 1.0, temperature: 2.0}

functionary_packing: false

training_args:
  max_steps: 15260                 # 15,260 x 65,536 = 1.000 B tokens
  dataset_text_field: text
  packing: true
  pad_to_multiple_of: 128
  dataset_num_proc: 16             # MUST stay 16: it is part of the cache key

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2   # 4 nodes x 4 GPUs x 2 = 32

  learning_rate: 1.0e-5
  weight_decay: 0.00
  warmup_steps: 380
  lr_scheduler_type: constant_with_warmup
  max_grad_norm: 0.5
  optim: adamw_torch
  bf16: true

  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}

  logging_steps: 10
  save_strategy: steps
  save_steps: 1526                 # every 100 M tokens -> 10 checkpoints
  save_total_limit: 10
  save_only_model: true            # weights only, ~10 GB each
  eval_strategy: steps
  eval_steps: 1526
  per_device_eval_batch_size: 1
  prediction_loss_only: true
  skip_memory_metrics: false
  report_to: none