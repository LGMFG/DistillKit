# SEED REPLICATE of r2_stage1_gdn_hybrid31 (r2_stage1_gdn_4node.yaml): identical except
# project_name, output_path and training_args.seed = 44.
# Generated by make_seed_replicates.py.
project_name: r2_stage1_gdn_hybrid31_s44

model: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/students/afm_gdn_hybrid31_init
trust_remote_code: true

output_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/output/r2_stage1_gdn_hybrid31_s44
use_flash_attention: true
sequence_length: 2048

# Anchored: main.py matches with re.search, so a bare `norm\.weight` would
# also freeze KDA's own o_norm.weight.  Verified: 147 frozen / 477 trainable.
frozen_res:
  - ^model\.embed_tokens\.
  - ^lm_head\.
  - ^model\.norm\.weight$
  - ^model\.layers\.[0-9]+\.(input_layernorm|post_attention_layernorm)\.weight$
  - ^model\.layers\.[0-9]+\.mlp\.

dataset:
  train_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/fineweb_edu_3B_train
  eval_dataset:
    disk_path: /leonardo_work/EUHPC_D34_049/WORK_LUKAS/datasets/fineweb_edu_3B_heldout
  seed: 42                # REQUIRED: the train split is 4 shards in order
  num_samples: 500000     # ~387k docs needed for 300 M tokens, +30% margin
  num_eval_samples: 200
  # prepared_dataset_path DELIBERATELY ABSENT -- save_to_disk runs at ~60 docs/s,
  # which would cost ~2 h inside the job at this scale.  TRL tokenizes at ~2700/s.

teacher:
  kind: hf
  path: arcee-ai/AFM-4.5B-Base
  kwargs:
    attn_implementation: flash_attention_2
    dtype: bfloat16

loss_functions:
  - {function: cross_entropy, weight: 0.2}
  - {function: kl,            weight: 0.2, temperature: 2.0}
  - {function: hs_cosine,     weight: 0.6}

layer_mapping: all

# false, and honestly so: it only installs a monkey patch that never fires
# without dataset.prepacked.  Leaving it true would misdescribe the run in the
# distillkit_config.yaml that gets written into output_path.  See doc section 6.
functionary_packing: false

training_args:
  seed: 44                         # data ORDER only; dataset.seed (pool + eval docs) stays 42
  max_steps: 4580                  # 4580 x 65,536 = 300.1 M tokens
  dataset_text_field: text
  packing: true
  pad_to_multiple_of: 128
  dataset_num_proc: 16

  per_device_train_batch_size: 1   # LOAD-BEARING (memory, and batch-1 assumptions)
  gradient_accumulation_steps: 2   # 4 nodes x 4 GPUs x 2 = global batch 32

  learning_rate: 1.0e-3
  weight_decay: 0.00
  warmup_ratio: 0.025              # x 4580 = ~114 warmup steps (R0 had half a step)
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs: {min_lr_rate: 0.01}   # NOT min_lr -- crashes under DeepSpeed
  max_grad_norm: 0.5
  optim: adamw_torch
  bf16: true

  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}

  logging_steps: 10
  save_strategy: steps
  save_steps: 500
  save_total_limit: 1
  eval_strategy: steps
  eval_steps: 500
  per_device_eval_batch_size: 1    # default 8 will OOM
  prediction_loss_only: true       # else HF gathers full logits
  skip_memory_metrics: false
  report_to: none